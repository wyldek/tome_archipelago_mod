name: ToME regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TOME_REQUIRE_LUA_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python tools/validate.py
# Native APWorld tests also run in tools/build.py --package-apworld, against
# the real runtime catalog selected for that release. CI does not invent one
# or package a fixture catalog as a player artifact.
